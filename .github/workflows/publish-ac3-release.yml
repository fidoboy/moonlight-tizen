name: Publish Moonlight Tizen 1.18.0 AC-3 experimental release

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-ac3-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    # Only the explicitly marked commit can publish this release.
    if: contains(github.event.head_commit.message, '[publish-release]')
    name: Publish Moonlight.wgt from the verified build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          ref: 8dfd3ea7b54f9f21d9e436d6dcba3caf468c7f74

      - name: Download the successful build for this exact source commit
        uses: actions/download-artifact@v4
        with:
          name: Moonlight-AC3-Experimental
          path: downloaded-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38484001734

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          test -s downloaded-artifact/Moonlight-AC3-Experimental.wgt
          cp downloaded-artifact/Moonlight-AC3-Experimental.wgt "$RUNNER_TEMP/Moonlight.wgt"
          test -s "$RUNNER_TEMP/Moonlight.wgt"
          sha256sum "$RUNNER_TEMP/Moonlight.wgt"

      - name: Keep a temporary copy of the release asset
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Tizen-1.18.0-AC3
          path: ${{ runner.temp }}/Moonlight.wgt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.18.0-ac3-8dfd3ea
          target_commitish: 8dfd3ea7b54f9f21d9e436d6dcba3caf468c7f74
          name: Moonlight Tizen 1.18.0 — AC-3/E-AC-3 passthrough (experimental)
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/Moonlight.wgt
          body: |
            Experimental fork build based on Moonlight Tizen 1.18.0 for Samsung Smart TVs.

            This pre-release is provided for review and testing of the changes in the `ac3-audio-passthrough` branch. It is not an official upstream release.

            Included changes:
            - Optional optical-audio output path negotiating AC-3/E-AC-3 where supported.
            - High-quality AC-3/E-AC-3 stream handling, including the increased client audio packet buffer.
            - Audio statistics overlay reporting the negotiated codec, channel layout and approximate bitrate.
            - Host-app quit option after a normal disconnect.
            - Updated translations and animated launch screen.

            A compatible experimental Sunshine host build is required for AC-3/E-AC-3 streaming. The client continues to support the normal audio path.

            Source branch: `ac3-audio-passthrough`
            Source commit: 8dfd3ea7b54f9f21d9e436d6dcba3caf468c7f74
