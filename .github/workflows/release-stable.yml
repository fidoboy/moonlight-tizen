name: Release WGTs

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'res/config.xml'
      - '.github/workflows/release-stable.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to publish (must match res/config.xml)'
        required: true
        type: string
        default: '1.0.0'

permissions:
  contents: write

jobs:
  publish:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[release]'))
    name: Build and publish versioned WGTs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml | head -n1)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic version such as 1.0.0, got: $VERSION" >&2
            exit 1
          fi
          CONFIG_VERSION="$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml | head -n1)"
          if [[ "$VERSION" != "$CONFIG_VERSION" ]]; then
            echo "Release version $VERSION does not match res/config.xml ($CONFIG_VERSION)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standard WGT
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-release:standard
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Extract standard WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create moonlight-tizen-release:standard)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          docker cp "$container_id:/home/moonlight/Moonlight.wgt" dist/Moonlight.wgt
          test -s dist/Moonlight.wgt
          sha256sum dist/Moonlight.wgt

      - name: Build ForceGM WGT
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-release:forcegm
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=true

      - name: Extract ForceGM WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create moonlight-tizen-release:forcegm)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          docker cp "$container_id:/home/moonlight/Moonlight-ForceGM.wgt" dist/Moonlight-ForceGM.wgt
          test -s dist/Moonlight-ForceGM.wgt
          sha256sum dist/Moonlight-ForceGM.wgt

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Moonlight Tizen v${{ steps.version.outputs.version }}
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/Moonlight.wgt
            dist/Moonlight-ForceGM.wgt
          body: |
            # Moonlight Tizen v${{ steps.version.outputs.version }} — independent fork

            This is the first-party release of the independently maintained fidoboy Moonlight Tizen fork.

            ## Highlights
            - Optional AC-3 (Dolby Digital) and E-AC-3 (Dolby Digital Plus) optical-audio passthrough for compatible TV/receiver configurations.
            - The normal OPUS audio path remains available; hosts that only offer OPUS remain compatible.
            - Audio statistics show the negotiated codec, channel layout, channel count and approximate bitrate.
            - Spanish localization and additional settings, launch-screen and input refinements.

            ## Dolby audio requirements
            Dolby passthrough requires a compatible experimental host, currently [fidoboy/Sunshine on the ac3-audio branch](https://github.com/fidoboy/Sunshine/tree/ac3-audio), and a TV/receiver path that supports the selected format. AC-3 is limited to 5.1 in the current host encoder. E-AC-3 support over optical varies by TV and receiver.

            Download `Moonlight.wgt` for the standard app. `Moonlight-ForceGM.wgt` is an alternate package for setups that specifically need the additional Game Mode metadata. See the [local installation guide](https://github.com/fidoboy/moonlight-tizen/blob/master/docs/Installation-Guide.md) and [features overview](https://github.com/fidoboy/moonlight-tizen/blob/master/docs/Features-Overview.md).
