name: Release WGTs

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'res/config.xml'
      - '.github/workflows/release-stable.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'New semantic version to publish; must match res/config.xml and must not already exist'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[release]'))
    name: Build and publish versioned WGTs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml | head -n1)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic version such as 1.0.0, got: $VERSION" >&2
            exit 1
          fi
          CONFIG_VERSION="$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml | head -n1)"
          if [[ "$VERSION" != "$CONFIG_VERSION" ]]; then
            echo "Release version $VERSION does not match res/config.xml ($CONFIG_VERSION)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing public release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/release.json --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [[ "$status" == "200" ]]; then
            echo "Release $RELEASE_TAG already exists. Refusing to overwrite a published version." >&2
            exit 1
          fi
          if [[ "$status" != "404" ]]; then
            echo "Unexpected GitHub API status $status while checking $RELEASE_TAG." >&2
            cat /tmp/release.json >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standard WGT
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-release:standard
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Extract standard WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create moonlight-tizen-release:standard)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          docker cp "$container_id:/home/moonlight/Moonlight.wgt" dist/Moonlight.wgt
          test -s dist/Moonlight.wgt
          sha256sum dist/Moonlight.wgt

      - name: Build ForceGM WGT
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-release:forcegm
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=true

      - name: Extract ForceGM WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create moonlight-tizen-release:forcegm)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          docker cp "$container_id:/home/moonlight/Moonlight-ForceGM.wgt" dist/Moonlight-ForceGM.wgt
          test -s dist/Moonlight-ForceGM.wgt
          sha256sum dist/Moonlight-ForceGM.wgt

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Moonlight Tizen with AC-3 support v${{ steps.version.outputs.version }}
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/Moonlight.wgt
            dist/Moonlight-ForceGM.wgt
          body: |
            This release builds on v1.0.1 with improvements to in-stream controls, gamepad identification, update preferences, and host pairing reliability. The existing optional AC-3/E-AC-3 optical-audio passthrough and OPUS compatibility remain unchanged.
            
            ## Highlights
            
            - **New Stream Menu:** Press the remote's Play/Pause key while streaming to open an in-stream menu with shortcuts to send WIN, ALT+TAB, ALT+F4 and F11, toggle performance statistics, disconnect, or close the menu. The menu integrates with controller/remote navigation, restores streaming focus when closed, and is cleaned up when the stream ends.
            - **Improved gamepad identification:** Reports controller-family metadata to the host and preserves physical gamepad indices. This helps compatible hosts select the appropriate controller profile automatically, rather than defaulting to Xbox emulation for every controller.
            - **More reliable host pairing:** Fixes pairing requests being canceled by unrelated HTTP request timeouts. Host polling is now stopped and restarted correctly around pairing, including when pairing is canceled.
            - **Optional automatic update checks:** A new setting in About lets users disable automatic update checks at startup. Checks remain enabled by default, and manual update checks are still available.
            - **Interface and localization refinements:** Improved the styling and navigation of the update-check setting, shortened the Spanish Stream Menu statistics label to fit the menu, and localized the new menu options. Removed the obsolete warning from the surround-audio channel settings.
            
            ## Credits
            
            Thanks to the contributors whose work helped make this release possible:
            
            - **Diogo8500** — pairing request queuing and cancellation fix ([PR #179](https://github.com/brightcraft/moonlight-tizen/pull/179), related [issue #176](https://github.com/brightcraft/moonlight-tizen/issues/176)); host polling lifecycle fix ([PR #180](https://github.com/brightcraft/moonlight-tizen/pull/180)); and the Stream Menu ([PR #177](https://github.com/brightcraft/moonlight-tizen/pull/177)).
            - **principalwater** — gamepad controller identity reporting and physical-index handling, based on [PR #171](https://github.com/brightcraft/moonlight-tizen/pull/171) and [issue #172](https://github.com/brightcraft/moonlight-tizen/issues/172).
            - **eduardomozart** — improved handling of Play, Pause and Play/Pause media key events ([commit `833becf`](https://github.com/brightcraft/moonlight-tizen/commit/833becf3408b9a7aeeea0d18d2126bf2ce522387)).
            
            ## Downloads and installation
            
            Download `Moonlight.wgt` for the standard app. `Moonlight-ForceGM.wgt` is the alternative package for setups that specifically need the additional Game Mode metadata.
            
            See the [installation guide](https://github.com/fidoboy/moonlight-tizen-ac3/blob/master/docs/Installation-Guide.md) and [features overview](https://github.com/fidoboy/moonlight-tizen-ac3/blob/master/docs/Features-Overview.md) for further details.
