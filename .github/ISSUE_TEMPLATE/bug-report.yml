name: Bug report
description: Report a reproducible bug or regression in Moonlight Tizen with AC-3 support
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check the troubleshooting guide and known limitations. Do not include passwords, pairing PINs, private keys, tokens, or other secrets.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened?
      placeholder: Describe the issue clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the steps and settings needed to reproduce the issue.
      placeholder: |
        1. Open Moonlight...
        2. Start a stream...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Explain what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Moonlight version
      description: Find this in Settings > About.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: tv-model
    attributes:
      label: Samsung TV model and Tizen version
      placeholder: "TV model; Tizen version"
    validations:
      required: true
  - type: input
    id: host-version
    attributes:
      label: Host software and version
      description: For Sunshine, include the branch/commit if it is an experimental build.
      placeholder: "Sunshine version / branch"
    validations:
      required: true
  - type: dropdown
    id: audio-codec
    attributes:
      label: Audio codec shown in the statistics overlay
      options:
        - OPUS
        - AC-3
        - E-AC-3
        - No active stream
        - Not sure
      multiple: false
      default: 0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove sensitive information before posting.
      render: text
    validations:
      required: false
