<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="text/javascript">
  (function() {
    function getDirectLaunchPayload() {
      try {
        var requested = tizen.application.getCurrentApplication().getRequestedAppControl();
        var data = requested && requested.appControl && requested.appControl.data;
        if (!data || !Array.isArray(data)) return null;
        for (var i = 0; i < data.length; i++) {
          if (data[i].key !== 'PAYLOAD' || !data[i].value || !data[i].value.length) continue;
          var payload = JSON.parse(data[i].value[0]);
          var actionData = JSON.parse(payload.values);
          if (actionData && actionData.serverUid &&
              actionData.appId !== null && actionData.appId !== undefined) {
            return {
              serverUid: String(actionData.serverUid),
              appId: actionData.appId,
              appName: actionData.appName || actionData.appTitle || actionData.title || actionData.name || null
            };
          }
        }
      } catch (error) {
        console.warn('[index.html] Could not inspect Smart Hub launch data:', error);
      }
      return null;
    }

    var directLaunch = getDirectLaunchPayload();
    if (!directLaunch) {
      window.location.replace('ui.html');
      return;
    }

    var scriptTag = function(src) {
      return '<scr' + 'ipt src="' + src + '"></scr' + 'ipt>';
    };
    var inlineScriptTag = function(source) {
      return '<scr' + 'ipt>' + source + '</scr' + 'ipt>';
    };
    var payloadJson = JSON.stringify(directLaunch).replace(/</g, '\\u003c');
    var parts = [
      '<!DOCTYPE html><html lang="en-US"><head>',
      '<meta charset="UTF-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
      '<style>',
      'html,body{margin:0;width:100%;height:100%;min-width:100%;min-height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif;}',
      '#listener{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;outline:none;}',
      '#wasm_module{position:absolute;left:50%;transform:translateX(-50%);border:0;outline:none;background:#000;}',
      '#directLaunchMessage{display:none;position:fixed;top:0;right:0;bottom:0;left:0;width:100vw;height:100vh;min-width:100%;min-height:100%;z-index:20;align-items:center;justify-content:center;box-sizing:border-box;padding:4vw;background:#000;color:#fff;font-size:30px;line-height:1.35;text-align:center;pointer-events:none;}',
      '.dialog-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;min-width:100%;min-height:100%;z-index:999;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;}',
      '.direct-stream-menu{box-sizing:border-box;color:#fff;background-color:#333846;width:30%;height:fit-content;max-height:88vh;overflow-y:auto;padding:20px;border-radius:16px;box-shadow:0 0 12px 6px rgba(0,163,198,1);}',
      '.direct-stream-menu .mdl-dialog__title{margin:0;padding:24px 24px 14px;font-size:2.8rem;font-weight:500;letter-spacing:.5px;}',
      '.direct-stream-menu .mdl-dialog__content{color:rgba(255,255,255,.9);padding:20px 24px 14px;display:block;}',
      '.direct-stream-menu .mdl-dialog__content p,.direct-stream-menu .mdl-dialog__content ul{line-height:normal;letter-spacing:.5px;}',
      '.direct-stream-menu button{width:100%;min-height:48px;padding:10px 14px;border:0;border-radius:8px;background:#465064;color:#fff;font-size:1.4rem;text-align:left;cursor:pointer;}',
      '.direct-stream-menu .mdl-dialog__content button{text-transform:uppercase;margin-bottom:10px;}',
      '.direct-stream-menu .mdl-dialog__actions{display:flex;justify-content:flex-end;padding:8px 8px 8px 16px;}',
      '.direct-stream-menu .mdl-dialog__actions button{width:100%;margin-bottom:10px;border-radius:8px;}',
      '.direct-stream-menu button.hovered,.direct-stream-menu button:focus{outline:2px solid #00a3c6;background:#007d99;}',
      '#connection-warnings{position:fixed;top:3%;left:3%;z-index:15;display:none;max-width:94%;padding:12px 18px;background:rgba(0,0,0,.65);color:#fff;font-size:18px;}',
      '#performance-stats{position:fixed;top:2%;left:2%;z-index:12;display:none;max-width:60%;white-space:pre-wrap;background:rgba(0,0,0,.65);color:#fff;font:16px monospace;}',
      '</style>',
      inlineScriptTag('window.__moonlightDirectLaunchPayload=' + payloadJson + ';'),
      scriptTag('platform.js'),
      scriptTag('$WEBAPIS/webapis/webapis.js'),
      scriptTag('static/js/jquery-2.2.0.min.js'),
      inlineScriptTag("window.t=function(message){var args=Array.prototype.slice.call(arguments,1);return String(message).replace(/%([0-9]+)[$]s/g,function(token,index){var value=args[Number(index)-1];return value==null?token:String(value);});};"),
      scriptTag('platform/i18n.js'),
      scriptTag('platform/messages.js'),
      scriptTag('platform/audio.js'),
      scriptTag('platform/index.js'),
      scriptTag('static/js/utils.js'),
      scriptTag('platform/common.js'),
      '</head><body>',
      '<div id="listener" tabindex="-1"></div>',
      '<div id="directLaunchMessage" role="status" aria-live="polite"></div>',
      '<div id="connection-warnings"></div>',
      '<div id="performance-stats"></div>',
      '<video id="wasm_module" autoplay tabindex="-1" style="display:none"></video>',
      '</body></html>'
    ];

    // No home/settings UI, summary bar, snackbar, navigation framework, or mDNS
    // discovery code is loaded for this route. Localization supports stream
    // messages and the on-demand stream menu only.
    document.open();
    document.write(parts.join(''));
    document.close();
  })();
  </script>
</head>
<body></body>
</html>
